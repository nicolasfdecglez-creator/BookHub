{% extends "base.html" %}

{% block title %}Edit {{ book.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>Edit Book</h3>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="author" class="form-label">Author <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="author" name="author" value="{{ book.author }}"
                                required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="genre" class="form-label">Genre</label>
                                <select class="form-select" id="genre" name="genre">
                                    <option value="">Select Genre</option>
                                    <option value="Fiction" {% if book.genre=='Fiction' %}selected{% endif %}>Fiction
                                    </option>
                                    <option value="Non-Fiction" {% if book.genre=='Non-Fiction' %}selected{% endif %}>
                                        Non-Fiction</option>
                                    <option value="Science Fiction" {% if book.genre=='Science Fiction' %}selected{%
                                        endif %}>Science Fiction</option>
                                    <option value="Fantasy" {% if book.genre=='Fantasy' %}selected{% endif %}>Fantasy
                                    </option>
                                    <option value="Mystery" {% if book.genre=='Mystery' %}selected{% endif %}>Mystery
                                    </option>
                                    <option value="Thriller" {% if book.genre=='Thriller' %}selected{% endif %}>Thriller
                                    </option>
                                    <option value="Romance" {% if book.genre=='Romance' %}selected{% endif %}>Romance
                                    </option>
                                    <option value="Biography" {% if book.genre=='Biography' %}selected{% endif %}>
                                        Biography</option>
                                    <option value="History" {% if book.genre=='History' %}selected{% endif %}>History
                                    </option>
                                    <option value="Self-Help" {% if book.genre=='Self-Help' %}selected{% endif %}>
                                        Self-Help</option>
                                    <option value="Other" {% if book.genre=='Other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="To Read" {% if book.status=='To Read' %}selected{% endif %}>To Read
                                    </option>
                                    <option value="Reading" {% if book.status=='Reading' %}selected{% endif %}>Reading
                                    </option>
                                    <option value="Completed" {% if book.status=='Completed' %}selected{% endif %}>
                                        Completed</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="rating" class="form-label">Rating (1-5)</label>
                            <select class="form-select" id="rating" name="rating">
                                <option value="">Not Rated</option>
                                <option value="1" {% if book.rating==1 %}selected{% endif %}>⭐ 1</option>
                                <option value="2" {% if book.rating==2 %}selected{% endif %}>⭐⭐ 2</option>
                                <option value="3" {% if book.rating==3 %}selected{% endif %}>⭐⭐⭐ 3</option>
                                <option value="4" {% if book.rating==4 %}selected{% endif %}>⭐⭐⭐⭐ 4</option>
                                <option value="5" {% if book.rating==5 %}selected{% endif %}>⭐⭐⭐⭐⭐ 5</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Current Cover</label>
                            <div class="mb-2">
                                <img src="{{ url_for('static', filename='uploads/covers/' + book.cover_image) }}"
                                    alt="{{ book.title }}" style="max-width: 200px;" class="img-thumbnail">
                            </div>
                            <label for="cover_image" class="form-label">Upload New Cover (optional)</label>
                            <input type="file" class="form-control" id="cover_image" name="cover_image"
                                accept="image/*">
                            <small class="form-text text-muted">Leave empty to keep current cover</small>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes"
                                rows="4">{{ book.notes or '' }}</textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('books.view_book', book_id=book.id) }}"
                                class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Book</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
